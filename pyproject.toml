[project]
name = "relay"
version = "0.1.0"
description = "High-volume SMS routing platform — flow POC (milestone 1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "msgpack>=1.0",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiohttp>=3.9",
]
# uvloop is Linux/macOS only; benchmarks run on Linux. On Windows this extra is
# simply uninstallable, which is fine — the code falls back to default asyncio.
perf = [
    "uvloop>=0.19; sys_platform != 'win32'",
]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async gotchas (blocking calls in async code)
]
ignore = [
    "B008",  # function call in argument defaults (FastAPI Depends idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

# ---------------------------------------------------------------------------
# mypy --strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tools", "tests"]

# Third-party packages without type stubs.
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "aiobotocore.*",
    "botocore.*",
    "msgpack.*",
    "uvloop.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
