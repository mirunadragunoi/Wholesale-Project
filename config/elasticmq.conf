# ElasticMQ configuration. Pre-declares the queues relay uses so that
# `docker compose up` yields a ready-to-use environment.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  ingress {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
  egress {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
  bench {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
  }
}
